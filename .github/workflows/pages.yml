# Publishes the dashboard to GitHub Pages as a static site.
#
# This deploys the frontend only, and that is a deliberate security boundary,
# not a shortcut: the FastAPI service exposes POST /runs, which spends real
# credits against whatever key is in .env. Nothing here carries a key and
# there is no backend to reach — the built site reads the snapshot committed
# to data/ as plain JSON files, so a public visitor cannot cost anyone money.
name: Deploy dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway, but queue at
# most one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Build
        working-directory: frontend
        # A project site is served from /<repo>/, so the base path has to be
        # baked in at build time or every asset URL 404s.
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
