# Checked by tombstone.utils.fetch before any request leaves the process.
# A domain with no entry here is treated as disallowed by default (fail closed).
# Every `allowed: false` row is surfaced in the dashboard's Omissions tab —
# "if in doubt, leave it out and say so" as a UI artifact, not a README line.

# --- Adviser-side sources -------------------------------------------------
# The brief notes the M&A adviser is "often absent from the acquirer's own
# release and only named elsewhere" — so an allowlist containing only
# acquirer press rooms makes that field structurally impossible to deliver,
# no matter how well the Adviser Hunter searches. These are the advisory
# firms' own transaction/tombstone pages: public marketing they publish
# precisely to be read and cited, with no scraping prohibition found.
#
# Deal-aggregator sites (fusacq.com and similar) are deliberately NOT here.
# They surfaced real advisers in testing, but their terms are ambiguous
# enough that "if in doubt, leave it out and say so" applies — they are
# disclosed in the Omissions tab when they name an adviser we can't use.

- domain: houlihanlokey.com
  allowed: true
  reason: "Adviser's own public transaction page; no scraping prohibition found."

- domain: clairfield.com
  allowed: true
  reason: "Adviser's own public transaction page; no scraping prohibition found."

