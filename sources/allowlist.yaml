# Checked by tombstone.utils.fetch before any request leaves the process.
# A domain with no entry here is treated as disallowed by default (fail closed).
# Every `allowed: false` row is surfaced in the dashboard's Omissions tab —
# "if in doubt, leave it out and say so" as a UI artifact, not a README line.

