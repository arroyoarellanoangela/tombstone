# Tool config only — dependencies live in requirements.txt / requirements-dev.txt.
# This project isn't pip-installed as a package; src/ is imported directly
# (from src.domain... etc), matching the rest of the Crata repos.

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# BLE (blind-except) is deliberately on: this pipeline talks to the live web
# and a subprocess, so a bare `except Exception` is sometimes correct — but it
# should have to be justified with a noqa and a reason, never appear by
# accident. PTH/UP/B/SIM/C4/RUF are the low-noise correctness and modernisation
# sets; the codebase passes all of them clean.
select = ["E", "F", "I", "W", "UP", "B", "SIM", "C4", "RUF", "BLE", "PTH", "PIE"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
